name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "hermes/**"

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"

      - name: Compute private artifact scan range
        id: scan-range
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE" != "0000000000000000000000000000000000000000" ]] && git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            echo "range=$BEFORE...HEAD" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "range=origin/main...HEAD" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "range=HEAD^...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run baseline CI checks
        env:
          PRIVATE_ARTIFACT_SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
          # GitHub-hosted runners have Docker, but this baseline should stay
          # credentials/data-free until Compose env fixtures are explicit.
          SKIP_COMPOSE_CONFIG: "1"
        run: scripts/ci_check.sh
