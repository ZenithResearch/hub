name: Gateway Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Gateway image tag to push. Defaults to gateway-<short-sha>."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: zenith-hub-prod-gateway-http

jobs:
  build:
    name: Build and push gateway image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials by OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="gateway-${GITHUB_SHA::12}"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "Invalid Docker tag: $TAG" >&2
            exit 2
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Gateway image tag: $TAG"

      - name: Build and push gateway image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DOCKER_PLATFORM: linux/amd64
          DOCKER_CACHE_FROM: type=gha,scope=gateway-http
          DOCKER_CACHE_TO: type=gha,mode=max,scope=gateway-http
        run: scripts/prod_build_image.sh

      - name: Deployment hint
        run: |
          echo "Pushed gateway image tag: ${{ steps.image.outputs.tag }}"
          echo "Deployment is Terraform-only: run scripts/prod_terraform_cd.sh with gateway_image_tag=${{ steps.image.outputs.tag }} and explicit live tags for every unaffected service."
