name: Hypha Administration Broker Image

on:
  pull_request:
    paths:
      - "services/hypha_admin_broker/**"
      - "scripts/bootstrap_hypha_admin_broker_authority.py"
      - "scripts/provision_matrix_admins.py"
      - ".github/workflows/hypha-admin-broker-image.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable candidate tag; defaults to hypha-admin-broker-<short-sha>."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: hypha-admin-broker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "610992396917"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: arn:aws:iam::610992396917:role/HyphaAdminBrokerImagePublisherRole
  ECR_REPOSITORY: hypha-admin-broker

jobs:
  verify:
    name: Build, exercise, and scan broker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build local verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/hypha_admin_broker/Dockerfile
          load: true
          tags: hypha-admin-broker:verify
          platforms: linux/amd64
      - name: Verify non-root runtime and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect hypha-admin-broker:verify --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect hypha-admin-broker:verify --format '{{json .Config.Healthcheck.Test}}')" != "null"
          docker run --rm --entrypoint python hypha-admin-broker:verify -c 'import fastapi,httpx,pydantic,uvicorn; print("runtime_dependencies_ok")'
      - name: Report all high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hypha-admin-broker:verify
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hypha-admin-broker:verify
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish reviewed broker candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure AWS credentials by OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable tag and registry
        id: image
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [[ -z "$TAG" ]]; then TAG="hypha-admin-broker-${GITHUB_SHA::12}"; fi
          [[ "$TAG" =~ ^hypha-admin-broker-([0-9a-f]{12})$ ]] || { echo "tag must name an exact 12-character source revision" >&2; exit 2; }
          SOURCE_REVISION="${BASH_REMATCH[1]}"
          SOURCE_COMMIT="$(git rev-parse --verify "$SOURCE_REVISION^{commit}")" ||
            { echo "tag source revision is unavailable" >&2; exit 2; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA" ||
            { echo "tag source revision is not in the publishing lineage" >&2; exit 2; }
          IMAGE_INPUTS=(
            .dockerignore
            services/hypha_admin_broker
            scripts/provision_matrix_admins.py
            scripts/bootstrap_hypha_admin_broker_authority.py
          )
          git diff --quiet "$SOURCE_COMMIT" "$GITHUB_SHA" -- "${IMAGE_INPUTS[@]}" ||
            { echo "tag source and workflow revision have different broker image inputs" >&2; exit 2; }
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACTUAL_ACCOUNT_ID" = "$AWS_ACCOUNT_ID" ]] || { echo "unexpected AWS account" >&2; exit 2; }
          aws ecr describe-repositories --repository-name "$ECR_REPOSITORY" >/dev/null
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
      - name: Authenticate to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${{ steps.image.outputs.registry }}"
      - name: Build and push reviewed candidate
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/hypha_admin_broker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.source_commit }}
            io.zenith.hub.workflow-revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Report all vulnerabilities in the exact pushed digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Fail on fixable vulnerabilities in the exact pushed digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Emit digest-pinned deployment reference
        run: |
          echo "source_revision=${{ steps.image.outputs.source_commit }}"
          echo "workflow_revision=${GITHUB_SHA}"
          echo "${{ steps.image.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"
